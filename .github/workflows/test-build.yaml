name: Test Build

# 测试构建：与 release.yaml 相同的构建逻辑，但不发布 Release
# 触发：推送 test-* 形式的 tag（如 test-0.0.1）
on:
  push:
    tags:
      - 'test-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Build 1.20.1
        run: gradle :1.20.1:build --no-daemon --stacktrace

      - name: Find JAR
        id: find_jar
        run: |
          JAR=$(find 1.20.1/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in 1.20.1/build/libs"
            exit 1
          fi
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR"

      # 不发布 Release，仅作为 CI 构建产物保留 14 天供下载验证
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JABD-${{ github.ref_name }}
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 14
