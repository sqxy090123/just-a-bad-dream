name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# 默认 GITHUB_TOKEN 仅有只读权限；发布 Release 需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Build 1.20.1
        run: gradle :1.20.1:build --no-daemon --stacktrace

      - name: Find JAR
        id: find_jar
        run: |
          JAR=$(find 1.20.1/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in 1.20.1/build/libs"
            exit 1
          fi
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: JABD ${{ github.ref_name }}
          body: |
            ## Just A Bad Dream (JABD) v${{ github.ref_name }}

            ### 安装
            1. 确保已安装 [Minecraft Forge 1.20.1](https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html)
            2. 将 JAR 文件放入 `.minecraft/mods/` 目录
            3. 启动游戏

            ### 主要功能
            - 🌙 温暖的床（下界之星+羊毛合成）— 睡觉进入梦境现实叠加态
            - 💀 真正死亡时无感回档 + 惊慌效果
            - 🔋 一次性使用 + 充能系统
            - 👥 多人模式：全员醒来 / 个人痕迹消散
            - ⚙️ 全功能配置 + `/baddream` 命令

            ### 配置
            详见 [README](https://github.com/${{ github.repository }})

            ---
            Minecraft Forge 1.20.1 | Java 17+
          files: |
            ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
