name: Build and Release

on:
  push:
    tags:
      # 正式版：0.0.1
      - '[0-9].[0-9].[0-9]*'
      # 预发布版：0.0.1-beta / 0.0.1-fix / 0.0.1-alpha
      - '[0-9].[0-9].[0-9]*-beta'
      - '[0-9].[0-9].[0-9]*-fix'
      - '[0-9].[0-9].[0-9]*-alpha'
      # alpha 带序号：0.0.1-alpha-1
      - '[0-9].[0-9].[0-9]*-alpha-[0-9]*'

# 默认 GITHUB_TOKEN 仅有只读权限；发布 Release 需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Build 1.20.1
        run: gradle :1.20.1:build --no-daemon --stacktrace

      - name: Resolve version & rename JAR
        id: meta
        run: |
          # tag 名，如 0.0.1 / 0.0.1-beta / 0.0.1-alpha-1
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # 游戏版本固定为子项目目录名 1.20.1
          GAME_VERSION="1.20.1"
          echo "game_version=$GAME_VERSION" >> $GITHUB_OUTPUT

          # 判断是否为预发布版本（tag 含 -beta / -fix / -alpha）
          if [[ "$TAG" =~ -(beta|fix|alpha) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # 原始构建产物
          SRC_JAR=$(find 1.20.1/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$SRC_JAR" ]; then
            echo "::error::No JAR found in 1.20.1/build/libs"
            exit 1
          fi

          # 目标文件名：Just-A-Bad-Dream-1.20.1-0.0.1.jar
          DST_NAME="Just-A-Bad-Dream-${GAME_VERSION}-${TAG}.jar"
          DST_JAR="1.20.1/build/libs/${DST_NAME}"
          cp "$SRC_JAR" "$DST_JAR"

          echo "src_jar=$SRC_JAR" >> $GITHUB_OUTPUT
          echo "dst_jar=$DST_JAR" >> $GITHUB_OUTPUT
          echo "dst_name=$DST_NAME" >> $GITHUB_OUTPUT
          echo "Renamed: $SRC_JAR -> $DST_JAR"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: JABD ${{ steps.meta.outputs.tag }}
          body: |
            ## Just A Bad Dream (JABD) v${{ steps.meta.outputs.tag }}

            ### 安装
            1. 确保已安装 [Minecraft Forge 1.20.1](https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html)
            2. 将 JAR 文件放入 `.minecraft/mods/` 目录
            3. 启动游戏

            ### 主要功能
            - 🌙 温暖的床（下界之星+羊毛合成）— 睡觉进入梦境现实叠加态
            - 💀 真正死亡时无感回档 + 惊慌效果
            - 🔋 一次性使用 + 充能系统
            - 👥 多人模式：全员醒来 / 个人痕迹消散
            - ⚙️ 全功能配置 + `/baddream` 命令

            ### 配置
            详见 [README](https://github.com/${{ github.repository }})

            ---
            Minecraft Forge 1.20.1 | Java 17+
          files: |
            ${{ steps.meta.outputs.dst_jar }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
